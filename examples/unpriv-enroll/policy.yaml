# One role, opened to unprivileged callers and restricted once they are in it.
#
# `unpriv-enroll: true` is what lets a process that is not root take this role
# through bpfjsrv. Without it the enrollment is refused and only root can ask,
# which is the default for every role that says nothing.
#
# The restrictions below:
#
#   bpf absent: the role may not call bpf(2) at all. This is what stops a shell in
#            the jail deleting its own entry from the jailer's maps and walking
#            out. `bpf-pod: true` would safely permit BPF objects from this pod,
#            but this shell does not need bpf(2) at all.
#   kill-pod: the role may signal only inside its own pod.
#   ptrace-pod: the role may attach only inside its own pod.
#   fs-any and verity-any: ordinary files and unsigned executables stay usable;
#            this example confines process interaction rather than the file tree.
#   enroll absent: bpfjsrv may add no further role to a process in this one, not
#            even another `sandbox` pod, so the jail cannot be widened or its
#            pod slots used up from inside.
#
roles:
  sandbox:
    unpriv-enroll: true
    fs-any: true
    verity-any: true
    kill-pod: true
    ptrace-pod: true
